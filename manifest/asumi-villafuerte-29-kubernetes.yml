# consultar versión de minikube
  #minikube version

# consultar si minikube esta en start o stop
  #minikube status

# iniciar clúster kubernetes
  #minikube start

# ingressar a la carpeta de los manifiestos de kubernetes (manifest)
  #cd manifest

# listar namespace
  #kubectl get namespace
  #kubectl get ns

# Solo crea
  #kubectl create namespace [nombre]
  #kubectl apply (crea y/o actualiza)

# crear un namespace "asumi-villafuerte-29" por comando mediante un archivo: "asumi-villafuerte-29-namespace.yml"
  #kubectl apply -f asumi-villafuerte-29-namespace.yml

# crear un secret "credentials" dentro del namespace "asumi-villafuerte-29" por comando mediante un archivo: "asumi-villafuerte-29-secret.yml"
  #kubectl apply -f asumi-villafuerte-29-secret.yml

# crear un service "api-ai-be" dentro del namespace "asumi-villafuerte-29" por comando mediante un archivo: "asumi-villafuerte-29-service.yml"
  #kubectl apply -f asumi-villafuerte-29-service.yml

# crear un deployment "api-ai-be" dentro del namespace "asumi-villafuerte-29" por comando mediante un archivo: "asumi-villafuerte-29-deployment.yml"
  #kubectl apply -f asumi-villafuerte-29-deployment.yml

# consultar namespace en uso por "default" | LINUX
  #kubectl config view --minify | grep namespace

# consultar namespace en uso por "default" | WINDOWS
  #kubectl config view --minify | findstr namespace

# cambiar un namespace en uso por "default" a "asumi-villafuerte-29"
  #kubectl config set-context --current --namespace=asumi-villafuerte-29-namespace



# consultar todos los recursos de un namespace "asumi-villafuerte-29-namespace"
  #kubectl get all -n asumi-villafuerte-29-namespace

# consultar todos los recursos y secret de un namespace "asumi-villafuerte-29-namespace"
  #kubectl get all,secrets -n asumi-villafuerte-29-namespace

# listar services del namespace "asumi-villafuerte-29-namespace"
  #minikube service asumi-villafuerte-29-service -n asumi-villafuerte-29-namespace
  #minikube service list

# probar el microservicio dentro del clúster con curl (MINIKUBE)
  #curl http://192.168.49.2:30001/api/translate/history
  #curl http://192.168.49.2:30001/api/youtube/history

# crear un túnel de puerto la máquina local (host) y el clúster de Kubernetes
  #kubectl port-forward service/asumi-villafuerte-29-service 8085:30001 -n asumi-villafuerte-29-namespace




# ver los logs del pod (logs del proyecto)
  #kubectl get pods -n asumi-villafuerte-29-namespace 
  #kubectl logs nombre-pod -n asumi-villafuerte-29-namespace -- nombre pod-asumi-villafuerte-29-deployment-5595dd958c-b579c
  #kubectl logs asumi-villafuerte-29-deployment-5595dd958c-b579c -n asumi-villafuerte-29-namespace

# aplicar todos los manifiestos a la vez
  #kubectl apply -f asumi-villafuerte-29-namespace.yml -f asumi-villafuerte-29-secret.yml -f asumi-villafuerte-29-service.yml -f asumi-villafuerte-29-deployment.yml



# PASO 1: minikube start
# PASO 2: cd manifest
# PASO 3: kubectl apply -f asumi-villafuerte-29-namespace.yml -f asumi-villafuerte-29-secret.yml -f asumi-villafuerte-29-service.yml -f asumi-villafuerte-29-deployment.yml
# PASO 4: minikube service asumi-villafuerte-29-service -n asumi-villafuerte-29-namespace
# PASO 5: kubectl get all -n asumi-villafuerte-29-namespace --> Opcional
