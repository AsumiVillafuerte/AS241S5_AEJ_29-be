name: SonarCloud Analysis

on:
  push:
    branches:
    - develop
  pull_request:
    branches:
    - develop

  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Dar permisos de ejecución al wrapper de Maven
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 4. Compilar y ejecutar tests con Maven (necesario para sonar.java.binaries y cobertura)
      - name: Build and Test with Maven
        run: ./mvnw clean verify sonar:sonar -Dsonar.projectKey=vallegrande-proyects_as241s5-aej-29-be -Dsonar.organization=vallegrande-proyects -Dsonar.host.url=https://sonarcloud.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
